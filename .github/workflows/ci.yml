name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities (Brakeman)
        run: bin/brakeman --no-pager

      - name: Audit gems for known CVEs (bundler-audit)
        run: bin/bundler-audit --update

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style (RuboCop)
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: rubyprice
          POSTGRES_PASSWORD: rubyprice
          POSTGRES_DB: rubyprice_test
        options: >-
          --health-cmd "pg_isready -U rubyprice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://rubyprice:rubyprice@localhost:5432/rubyprice_test
      REDIS_URL: redis://localhost:6379/0
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:schema:load

      - name: Run test suite (RSpec)
        run: bundle exec rspec

  build:
    runs-on: ubuntu-latest
    needs: [ security, lint, test ]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rubyprice:ci .
